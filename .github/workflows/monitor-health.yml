name: 🩺 Monitor SeaWhale Pro Health

on:
  schedule:
    - cron: "*/5 * * * *"   # تشغيل كل 5 دقائق
  workflow_dispatch:         # إمكانية التشغيل اليدوي من Actions

permissions:
  contents: read

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 🔍 Check SeaWhale Health Endpoint
        id: health
        run: |
          echo "Checking https://seawhile-by5-vq.fly.dev/health ..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://seawhile-by5-vq.fly.dev/health || echo "000")
          if [ "$STATUS" -eq 200 ]; then
            echo "✅ App is healthy (HTTP $STATUS)"
            echo "healthy=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Health check failed (HTTP $STATUS)"
            echo "healthy=false" >> $GITHUB_OUTPUT
          fi

      - name: ⚠️ Restart App if Unhealthy
        if: steps.health.outputs.healthy == 'false'
        run: |
          echo "Restarting Fly.io app: seawhile-by5-vq ..."
          flyctl auth login --access-token "${{ secrets.FLY_API_TOKEN }}"
          flyctl machines restart --app seawhile-by5-vq
          echo "♻️ Restart command executed."

      # ✅ Notify Telegram (Healthy)
      - name: 📲 Notify Telegram (Healthy)
        if: steps.health.outputs.healthy == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TIME=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          MSG="✅ *SeaWhale Pro Health Check Passed!*%0A🕒 Time: ${TIME}%0A🌍 App: seawhile-by5-vq.fly.dev%0AStatus: Healthy"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=Markdown"

      # ❌ Notify Telegram (Restarted)
      - name: 📲 Notify Telegram (Restarted)
        if: steps.health.outputs.healthy == 'false'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TIME=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          MSG="⚠️ *SeaWhale Pro Restart Triggered!*%0A🕒 Time: ${TIME}%0AReason: Health check failed%0A🔁 App restarted automatically on Fly.io."
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=Markdown"

name: 🧠 SeaWhale Pro — Smart Health AI Monitor (v2)

on:
  schedule:
    - cron: "*/5 * * * *"  # فحص كل 5 دقائق
  workflow_dispatch:

permissions:
  contents: write

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  HEALTH_URL: "https://seawhile-by5-vq.fly.dev/health"

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🔍 Check Health Endpoint
        id: check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")
          echo "HTTP_STATUS=$STATUS" >> $GITHUB_ENV
          if [ "$STATUS" -eq 200 ]; then
            echo "healthy=true" >> $GITHUB_OUTPUT
          else
            echo "healthy=false" >> $GITHUB_OUTPUT
          fi

      - name: 💾 Track Failure Count
        id: track
        run: |
          mkdir -p .monitor
          FAIL_FILE=".monitor/fail_count.txt"
          RECOVERY_FILE=".monitor/recovery_timer.txt"
          COUNT=0
          if [ -f "$FAIL_FILE" ]; then
            COUNT=$(cat "$FAIL_FILE")
          fi
          if [ "${{ steps.check.outputs.healthy }}" == "false" ]; then
            COUNT=$((COUNT+1))
          else
            COUNT=0
            rm -f "$RECOVERY_FILE"
          fi
          echo "$COUNT" > "$FAIL_FILE"
          echo "fail_count=$COUNT" >> $GITHUB_OUTPUT
          echo "📊 Current fail count: $COUNT"

      - name: ⚠️ Restart App if Unhealthy
        if: steps.check.outputs.healthy == 'false'
        run: |
          echo "⚠️ App unhealthy, restarting Fly.io instance..."
          flyctl auth login --access-token "$FLY_API_TOKEN"
          flyctl machines restart --app seawhile-by5-vq || echo "⚠️ Restart command failed!"
          echo "♻️ Restart attempted."

      - name: 🚫 Disable Live Trading after 3 consecutive failures
        if: steps.track.outputs.fail_count > 2
        run: |
          echo "🚨 3 consecutive failures — disabling live trading!"
          gh secret set ENABLE_LIVE_TRADING --body "false"
          date -u +%s > .monitor/recovery_timer.txt
          echo "✅ Live trading disabled and recovery timer started."

      - name: 🔁 Smart Recovery — Re-enable after 2 hours of stability
        if: steps.check.outputs.healthy == 'true'
        run: |
          if [ -f ".monitor/recovery_timer.txt" ]; then
            START=$(cat .monitor/recovery_timer.txt)
            NOW=$(date -u +%s)
            DIFF=$((NOW - START))
            if [ $DIFF -ge 7200 ]; then
              echo "🕒 2 hours passed — re-enabling live trading."
              gh secret set ENABLE_LIVE_TRADING --body "true"
              rm -f .monitor/recovery_timer.txt
            else
              echo "⏳ Still in cooldown ($((7200 - DIFF)) seconds left)."
            fi
          else
            echo "✅ No cooldown active, system healthy."
          fi

      # ✅ Telegram — success
      - name: 📲 Notify Telegram (Healthy)
        if: steps.check.outputs.healthy == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="✅ *SeaWhale Pro Healthy!*%0A🌍 App: seawhile-by5-vq.fly.dev%0A🧠 Status: Stable and responsive"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MSG}" -d "parse_mode=Markdown"

      # ⚠️ Telegram — restart notice
      - name: 📲 Notify Telegram (Restart Triggered)
        if: steps.check.outputs.healthy == 'false'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="⚠️ *SeaWhale Restart Triggered!*%0AReason: Health check failed%0AFailures: ${{ steps.track.outputs.fail_count }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MSG}" -d "parse_mode=Markdown"

      # 🔔 Telegram — trading disabled
      - name: 🚫 Notify Telegram (Trading Disabled)
        if: steps.track.outputs.fail_count > 2
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="🚫 *SeaWhale Live Trading Disabled!*%0AReason: Consecutive health check failures (3x)%0A🕒 Recovery timer started (2 hours)."
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MSG}" -d "parse_mode=Markdown"

      # ✅ Telegram — smart recovery
      - name: 🔁 Notify Telegram (Recovery Activated)
        if: steps.check.outputs.healthy == 'true'
        run: |
          if [ -f ".monitor/recovery_timer.txt" ]; then
            REMAIN=$((7200 - $(($(date -u +%s) - $(cat .monitor/recovery_timer.txt)))))
            if [ $REMAIN -le 0 ]; then
              MSG="🧠 *Smart Recovery Activated!*%0A✅ Live trading re-enabled after 2 hours of stability."
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d "chat_id=${TELEGRAM_CHAT_ID}" \
                -d "text=${MSG}" -d "parse_mode=Markdown"
            fi
          fi

name: 🤖 SeaWhale Pro — Daily Intelligence Report

on:
  schedule:
    - cron: "0 12 * * *"  # يعمل يوميًا الساعة 12 ظهراً بتوقيت UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  REDIS_URL: ${{ secrets.REDIS_URL }}
  APP_NAME: "seawhile-by5-vq"
  HEALTH_URL: "https://seawhile-by5-vq.fly.dev/health"

jobs:
  intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🧰 Install Tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq curl redis-tools
          curl -L https://fly.io/install.sh | sh
          echo "/home/runner/.fly/bin" >> $GITHUB_PATH

      - name: 🧠 Check Health Endpoint
        id: health
        run: |
          echo "Checking health at: $HEALTH_URL"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")
          if [ "$STATUS" -eq 200 ]; then
            echo "health=✅ Healthy" >> $GITHUB_OUTPUT
          elif [ "$STATUS" -eq 000 ]; then
            echo "health=⚠️ Timeout / No Response" >> $GITHUB_OUTPUT
          else
            echo "health=❌ Unreachable ($STATUS)" >> $GITHUB_OUTPUT
          fi

      - name: 🔍 Fetch Fly.io App Info
        id: info
        run: |
          flyctl auth login --access-token "${{ secrets.FLY_API_TOKEN }}" || exit 0
          DEPLOY_TIME=$(flyctl status --app "$APP_NAME" --json 2>/dev/null | jq -r '.CurrentRelease.CreatedAt' | head -n 1)
          MACHINES=$(flyctl machines list --app "$APP_NAME" --json 2>/dev/null | jq '. | length')
          echo "deploy_time=${DEPLOY_TIME:-Unknown}" >> $GITHUB_OUTPUT
          echo "machines=${MACHINES:-0}" >> $GITHUB_OUTPUT

      - name: 📊 Fetch Redis Metrics (Trading Stats)
        id: redis
        run: |
          if [ -n "${{ secrets.REDIS_URL }}" ]; then
            echo "Collecting Redis stats..."
            redis-cli -u "${{ secrets.REDIS_URL }}" INFO stats | grep -E "connected_clients|total_commands_processed|expired_keys" > redis_stats.txt || echo "Redis unavailable" > redis_stats.txt
            redis-cli -u "${{ secrets.REDIS_URL }}" GET last_trade > last_trade.txt || echo "No trade data" > last_trade.txt
            redis-cli -u "${{ secrets.REDIS_URL }}" GET total_profit_usd > total_profit.txt || echo "0" > total_profit.txt
          else
            echo "No Redis URL configured" > redis_stats.txt
            echo "N/A" > last_trade.txt
            echo "0" > total_profit.txt
          fi

      - name: 🧾 Build Intelligence Report
        id: summary
        run: |
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          TRADING_MODE=$( [ "${{ secrets.ENABLE_LIVE_TRADING }}" == "true" ] && echo "🟢 Live Trading" || echo "🧪 Paper Mode" )
          HEALTH="${{ steps.health.outputs.health }}"
          MACHINES="${{ steps.info.outputs.machines }}"
          DEPLOY="${{ steps.info.outputs.deploy_time }}"
          PROFIT=$(cat total_profit.txt)
          LAST_TRADE=$(cat last_trade.txt | head -n 1)
          echo "📊 *SeaWhale Intelligence Report*\n" > report.txt
          echo "🕒 Date: $DATE" >> report.txt
          echo "🌍 Health: $HEALTH" >> report.txt
          echo "💱 Mode: $TRADING_MODE" >> report.txt
          echo "⚙️ Machines Active: $MACHINES" >> report.txt
          echo "🚀 Last Deploy: $DEPLOY" >> report.txt
          echo "💰 Total Profit (est.): $${PROFIT}" >> report.txt
          echo "📈 Last Trade: ${LAST_TRADE:-N/A}" >> report.txt
          echo "\n🧠 Redis Stats:" >> report.txt
          cat redis_stats.txt >> report.txt
          echo "\n🐋 *Stay calm and keep swimming...*" >> report.txt
          cat report.txt

      - name: 📲 Send Telegram Intelligence Report
        run: |
          TEXT=$(cat report.txt | sed 's/"/\\"/g' | sed "s/'/\\'/g")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=${TEXT}" \
            -d "parse_mode=Markdown"

name: 📊 SeaWhale Pro — Daily Health Report

on:
  schedule:
    - cron: "0 12 * * *"  # يعمل يوميًا الساعة 12 ظهراً بتوقيت UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  APP_NAME: "seawhile-by5-vq"
  HEALTH_URL: "https://seawhile-by5-vq.fly.dev/health"

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🧰 Install Flyctl CLI
        run: |
          curl -L https://fly.io/install.sh | sh
          echo "/home/runner/.fly/bin" >> $GITHUB_PATH

      - name: 🧠 Check Health Endpoint
        id: health
        run: |
          echo "Checking health at: $HEALTH_URL"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")
          if [ "$STATUS" -eq 200 ]; then
            echo "health=✅ Healthy (HTTP 200)" >> $GITHUB_OUTPUT
          elif [ "$STATUS" -eq 000 ]; then
            echo "health=⚠️ No Response (Timeout)" >> $GITHUB_OUTPUT
          else
            echo "health=❌ Unreachable (HTTP $STATUS)" >> $GITHUB_OUTPUT
          fi

      - name: 🔍 Fetch Fly.io App Info
        id: info
        run: |
          flyctl auth login --access-token "${{ secrets.FLY_API_TOKEN }}" || exit 0
          DEPLOY_TIME=$(flyctl status --app "$APP_NAME" --json 2>/dev/null | jq -r '.CurrentRelease.CreatedAt' | head -n 1)
          MACHINES=$(flyctl machines list --app "$APP_NAME" --json 2>/dev/null | jq '. | length')
          echo "deploy_time=${DEPLOY_TIME:-Unknown}" >> $GITHUB_OUTPUT
          echo "machines=${MACHINES:-0}" >> $GITHUB_OUTPUT

      - name: 🧾 Summarize System Status
        id: summary
        run: |
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          TRADING_MODE=$( [ "${{ secrets.ENABLE_LIVE_TRADING }}" == "true" ] && echo "🟢 Live Trading" || echo "🧪 Paper Mode" )
          echo "📅 *SeaWhale Pro — Daily Report*\n" > report.txt
          echo "🕒 Date: $DATE" >> report.txt
          echo "🌍 Health: ${{ steps.health.outputs.health }}" >> report.txt
          echo "💱 Trading Mode: $TRADING_MODE" >> report.txt
          echo "⚙️ Machines Active: ${{ steps.info.outputs.machines }}" >> report.txt
          echo "🚀 Last Deploy: ${{ steps.info.outputs.deploy_time }}" >> report.txt
          echo "\n🐋 _Stay calm and keep swimming._" >> report.txt
          cat report.txt

      - name: 📲 Send Telegram Report
        run: |
          TEXT=$(cat report.txt | sed 's/"/\\"/g' | sed "s/'/\\'/g")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=${TEXT}" \
            -d "parse_mode=Markdown"
